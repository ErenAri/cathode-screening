apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cathode-network-policy
  namespace: cathode-screening
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow ingress controller to reach backend and frontend
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - port: 8080
        - port: 3000
    # Allow intra-namespace communication
    - from:
        - podSelector: {}
  egress:
    # Allow intra-namespace
    - to:
        - podSelector: {}
    # Allow DNS resolution
    - to:
        - namespaceSelector: {}
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # Allow HTTPS outbound (for OTEL, MLflow, external APIs)
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - port: 443
          protocol: TCP
