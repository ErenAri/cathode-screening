apiVersion: apps/v1
kind: Deployment
metadata:
  name: cathode-celery-worker
  namespace: cathode-screening
  labels:
    app.kubernetes.io/name: cathode-celery-worker
    app.kubernetes.io/component: worker
    app.kubernetes.io/part-of: cathode-screening
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: cathode-celery-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cathode-celery-worker
        app.kubernetes.io/component: worker
    spec:
      terminationGracePeriodSeconds: 120
      containers:
        - name: worker
          image: cathode-screening/backend:latest
          imagePullPolicy: IfNotPresent
          command:
            - celery
            - -A
            - cathode_screening.queue.celery_app
            - worker
            - --loglevel=info
            - --concurrency=2
            - -Q
            - inference,monitoring
          envFrom:
            - configMapRef:
                name: cathode-config
            - secretRef:
                name: cathode-secrets
          resources:
            requests:
              cpu: "1"
              memory: "2Gi"
            limits:
              cpu: "4"
              memory: "8Gi"
              # Uncomment for GPU workers:
              # nvidia.com/gpu: "1"
          volumeMounts:
            - name: artifacts
              mountPath: /app/artifacts
              readOnly: true
            - name: data
              mountPath: /app/data
              readOnly: true
      volumes:
        - name: artifacts
          persistentVolumeClaim:
            claimName: cathode-artifacts
        - name: data
          persistentVolumeClaim:
            claimName: cathode-data
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cathode-celery-beat
  namespace: cathode-screening
  labels:
    app.kubernetes.io/name: cathode-celery-beat
    app.kubernetes.io/component: scheduler
    app.kubernetes.io/part-of: cathode-screening
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cathode-celery-beat
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cathode-celery-beat
        app.kubernetes.io/component: scheduler
    spec:
      containers:
        - name: beat
          image: cathode-screening/backend:latest
          imagePullPolicy: IfNotPresent
          command:
            - celery
            - -A
            - cathode_screening.queue.celery_app
            - beat
            - --loglevel=info
          envFrom:
            - configMapRef:
                name: cathode-config
            - secretRef:
                name: cathode-secrets
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
