apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: cathode-backend-hpa
  namespace: cathode-screening
  labels:
    app.kubernetes.io/name: cathode-backend
    app.kubernetes.io/part-of: cathode-screening
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: cathode-backend
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: cathode-celery-worker-hpa
  namespace: cathode-screening
  labels:
    app.kubernetes.io/name: cathode-celery-worker
    app.kubernetes.io/part-of: cathode-screening
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: cathode-celery-worker
  minReplicas: 1
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: cathode-frontend-hpa
  namespace: cathode-screening
  labels:
    app.kubernetes.io/name: cathode-frontend
    app.kubernetes.io/part-of: cathode-screening
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: cathode-frontend
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
