  name: cathode-secrets
  namespace: cathode-screening
  labels:
    app.kubernetes.io/name: cathode-screening
type: Opaque
# Values must be base64-encoded. Replace these placeholders before applying.
# In production, use sealed-secrets, external-secrets-operator, or Vault.
stringData:
  CATHODE_MANIFEST_HMAC_KEY: "REPLACE_ME"
  CATHODE_API_KEY: "REPLACE_ME"
  POSTGRES_PASSWORD: "REPLACE_ME"
  CATHODE_SSO_JWT_SECRET: "REPLACE_ME"
  CATHODE_SSO_CLIENT_SECRET: "REPLACE_ME"
