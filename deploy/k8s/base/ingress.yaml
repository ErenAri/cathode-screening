apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cathode-ingress
  namespace: cathode-screening
  labels:
    app.kubernetes.io/name: cathode-screening
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    nginx.ingress.kubernetes.io/rate-limit: "120"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - cathode.example.com
      secretName: cathode-tls
  rules:
    - host: cathode.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: cathode-backend
                port:
                  number: 8080
          - path: /v1
            pathType: Prefix
            backend:
              service:
                name: cathode-backend
                port:
                  number: 8080
          - path: /predict
            pathType: Prefix
            backend:
              service:
                name: cathode-backend
                port:
                  number: 8080
          - path: /metrics
            pathType: Prefix
            backend:
              service:
                name: cathode-backend
                port:
                  number: 8080
          - path: /auth
            pathType: Prefix
            backend:
              service:
                name: cathode-backend
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cathode-frontend
                port:
                  number: 3000
