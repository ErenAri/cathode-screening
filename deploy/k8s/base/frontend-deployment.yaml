apiVersion: apps/v1
kind: Deployment
metadata:
  name: cathode-frontend
  namespace: cathode-screening
  labels:
    app.kubernetes.io/name: cathode-frontend
    app.kubernetes.io/component: ui
    app.kubernetes.io/part-of: cathode-screening
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: cathode-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cathode-frontend
        app.kubernetes.io/component: ui
    spec:
      containers:
        - name: frontend
          image: cathode-screening/frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: NEXT_PUBLIC_API_URL
              value: "http://cathode-backend:8080"
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: cathode-frontend
  namespace: cathode-screening
  labels:
    app.kubernetes.io/name: cathode-frontend
    app.kubernetes.io/component: ui
spec:
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: cathode-frontend
