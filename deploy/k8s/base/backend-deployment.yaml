apiVersion: apps/v1
kind: Deployment
metadata:
  name: cathode-backend
  namespace: cathode-screening
  labels:
    app.kubernetes.io/name: cathode-backend
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: cathode-screening
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: cathode-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cathode-backend
        app.kubernetes.io/component: api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics/prometheus"
    spec:
      serviceAccountName: cathode-backend
      terminationGracePeriodSeconds: 30
      containers:
        - name: api
          image: cathode-screening/backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: cathode-config
            - secretRef:
                name: cathode-secrets
          env:
            - name: PORT
              value: "8080"
            - name: CATHODE_DATABASE_URL
              value: "postgresql://cathode:$(POSTGRES_PASSWORD)@postgres:5432/cathode"
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "4Gi"
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 30
          volumeMounts:
            - name: artifacts
              mountPath: /app/artifacts
              readOnly: true
            - name: data
              mountPath: /app/data
              readOnly: true
      volumes:
        - name: artifacts
          persistentVolumeClaim:
            claimName: cathode-artifacts
        - name: data
          persistentVolumeClaim:
            claimName: cathode-data
---
apiVersion: v1
kind: Service
metadata:
  name: cathode-backend
  namespace: cathode-screening
  labels:
    app.kubernetes.io/name: cathode-backend
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: cathode-backend
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cathode-backend
  namespace: cathode-screening
  labels:
    app.kubernetes.io/name: cathode-backend
