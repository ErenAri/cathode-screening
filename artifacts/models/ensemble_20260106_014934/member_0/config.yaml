data:
  aux_target:
    enabled: false
    name: formation_energy_per_atom
    weight: 0.3
  dataset_name: mp_cathodes_v1
  processed_dir: data/processed/mp
  splits_manifest: data/splits/mp/splits_mp_cathodes_v1_soap-loco.json
  target:
    name: energy_above_hull
    type: regression
logging:
  console: true
  save_best_only: true
  save_every_epoch: false
  wandb:
    enabled: false
    project: cathode-screening
loss:
  cls_weight: 0.05
  fallback:
    delta: 0.1
    name: huber
  primary:
    delta: 0.1
    name: huber
  sigma_weight: 0.5
metrics:
  report:
  - mae
  - rmse
  - spearman
  - topk_hit_rate
  - ece
  topk:
    k_values:
    - 10
    - 25
    - 50
    metastable_threshold_ehull: 0.1
    stable_threshold_ehull: 0.05
model:
  dropout: 0.1
  edge_rbf_bins: 41
  heads:
    max_log_sigma: 2.0
    min_log_sigma: -4.0
    predict_uncertainty: true
  message_passing_layers: 4
  node_embed_dim: 128
  node_in_dim: 6
  pooling: attn
  type: cgcnn
project:
  artifacts_dir: artifacts\models\ensemble_20260106_014934\member_0
  name: cathode-screening-soap-loco
  output_dir: .
  reports_dir: artifacts\models\ensemble_20260106_014934\member_0
  run_id: member_0
train:
  balanced_sampling: true
  balanced_sampling_start_epoch: 6
  batch_size: 256
  device: auto
  early_stopping:
    mode: min
    monitor: val_mae
    patience: 15
  epochs: 100
  grad_clip_norm: 0.5
  num_workers: 0
  optimizer:
    lr: 0.0001
    name: adamw
    weight_decay: 0.0
  precision: fp32
  scheduler:
    gamma: 0.1
    milestones:
    - 60
    - 80
    type: constant
  seed: 42
  warmup_epochs: 5
