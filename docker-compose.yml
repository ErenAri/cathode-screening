version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend.Dockerfile
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - CATHODE_ENV=development
      - CATHODE_AUTH_ENABLED=false
      - CATHODE_REQUIRE_MANIFEST_SIGNATURE=${CATHODE_REQUIRE_MANIFEST_SIGNATURE:-true}
      - CATHODE_MANIFEST_HMAC_KEY=${CATHODE_MANIFEST_HMAC_KEY}
    volumes:
      - ./artifacts:/app/artifacts # Live usage of artifacts (optional)
      - ./data:/app/data # Live usage of data (optional)

  frontend:
    build:
      context: .
      dockerfile: frontend.Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8080 # Internal network communication
    depends_on:
      - backend
